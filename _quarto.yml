project:
  type: website
  output-dir: _site
  preview:
    watch-inputs: true
  resources:
    - README.md
  render:
    # Explicit pages to render
    - index.qmd # renders README
    - reports/atlas_model_drivers.qmd
    - reports/downscaling_results.qmd
    - reports/scenarios.qmd
    - reports/design_point_validation.qmd
    - reports/variable_importance.qmd
    - docs/training/downscaling_inventory.qmd
    - docs/training/CARB-downscaling-setup.md
    - docs/training/index.qmd
    - docs/workflow_documentation.md
    - docs/references.md
    - docs/mixed_system_prototype.qmd

website:
  title: "MAGiC Downscaling"
  search: true
  page-navigation: true
  sidebar:
    style: docked
    collapse-level: 2
    contents:
      - href: index.qmd
        text: Home
      - section: Results
        contents:
          - href: reports/downscaling_results.qmd
            text: Inventory Results
          - href: reports/scenarios.qmd
            text: Scenario-Based Analysis
      - section: "Methods and Evaluation"
        contents:
          - href: reports/atlas_model_drivers.qmd
            text: Model Drivers
          - href: reports/design_point_validation.qmd
            text: Design Point Validation
          - href: reports/variable_importance.qmd
            text: Downscaling Model Evaluation
      - section: Training
        contents:
          - href: docs/training/index.qmd
            text: Overview
          - href: docs/training/CARB-downscaling-setup.md
            text: Environment Setup
          - href: docs/training/downscaling_inventory.qmd
            text: Inventory Downscaling
      - section: Docs
        contents:
          - href: docs/workflow_documentation.md
            text: Technical Documentation
          - href: docs/mixed_system_prototype.qmd
            text: Mixed System Prototype
          - href: docs/references.md
            text: References
    tools:
      - icon: exclamation-octagon
        text: "Status: Draft"
      - icon: github
        href: https://github.com/ccmmf/downscaling

lightbox: auto

format:
  html:
    theme: cosmo
    toc: true
    self-contained: false
    df-print: paged

# Freeze results so CI can publish without re-executing heavy code.
execute:
  echo: false
  freeze: auto

author:
  - "David LeBauer"
  - "Akash B V"
date: today
